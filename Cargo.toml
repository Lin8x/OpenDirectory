[workspace]
resolver = "2"
members = ["crates/od-core", "crates/od-client", "crates/od-server", "crates/od-agent", "crates/od-cli", "apps/admin-center/src-tauri", "xtask"]
# The desktop app needs WebKitGTK/WebView2 to build, so it is not built by default.
default-members = ["crates/od-core", "crates/od-client", "crates/od-server", "crates/od-agent", "crates/od-cli", "xtask"]

[workspace.package]
version = "0.11.0"
edition = "2021"
rust-version = "1.80"
repository = "https://github.com/Lin8x/OpenDirectory"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
thiserror = "1"
od-core = { path = "crates/od-core" }
od-client = { path = "crates/od-client" }
od-server = { path = "crates/od-server" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
