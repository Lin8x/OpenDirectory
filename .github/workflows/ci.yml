name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude od-admin-center

  agent:
    name: Agent, server and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p od-agent -p od-server -p od-cli
      - run: cargo test -p od-core -p od-agent
      - uses: actions/upload-artifact@v4
        with:
          name: opendirectory-${{ matrix.os }}
          path: |
            target/release/opendirectory-agent*
            target/release/opendirectory-server*
            target/release/od
            target/release/od.exe
          if-no-files-found: warn

  admin-center:
    name: Admin Center (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-center/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/admin-center
        run: npm ci
      - name: Typecheck and build UI
        working-directory: apps/admin-center
        run: npm run build
      - name: Build desktop app
        working-directory: apps/admin-center
        run: npx tauri build --bundles ${{ runner.os == 'Linux' && 'deb' || runner.os == 'Windows' && 'msi' || 'app' }}
      - uses: actions/upload-artifact@v4
        with:
          name: admin-center-${{ matrix.os }}
          path: |
            target/release/bundle/**
          if-no-files-found: warn
