[package]
name = "od-admin-center"
description = "OpenDirectory Admin Center desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "opendirectory-admin-center"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
od-server.workspace = true
od-client.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
# Set by `tauri build`: serve the bundled UI instead of the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
