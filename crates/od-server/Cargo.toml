[package]
name = "od-server"
description = "OpenDirectory server: directory, policy engine, and agent gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "opendirectory-server"
path = "src/main.rs"

[dependencies]
od-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
rustls.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
tower = "0.5"
time = "0.3"
md-5 = "0.10"
ldap3_proto = "0.9"
tokio-util = { version = "0.7", features = ["codec"] }
md4 = "0.10"
sha1 = "0.10"
des = "0.8"
base64 = "0.22"
flate2 = "1"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
hmac = "0.12"
reqwest.workspace = true
od-client.workspace = true
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "4"
suppaftp = { version = "13", default-features = false, features = ["tokio", "tokio-rustls-ring"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
md-5 = "0.10"
ldap3_proto = "0.9"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
