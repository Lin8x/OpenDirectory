[package]
name = "od-agent"
description = "OpenDirectory Endpoint Agent: inventory, policy, sign-in accounts and remote scripts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "opendirectory-agent"
path = "src/main.rs"

[dependencies]
od-core.workspace = true
od-client.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
rcgen = "0.13"
portable-pty = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network", "user"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# libX11/libXtst loaded at run time (XTEST input for background sessions),
# so the agent still runs on servers without X libraries.
x11-dl = "2.21"
